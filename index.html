<style>
/* Layout: one working column — index quote + breadth up top, then a dense sortable ledger of constituents. */
:root {
  --paper: #f5f6f3;
  --panel: #ffffff;
  --ink: #17201c;
  --muted: #5d6a63;
  --rule: #dde2dd;
  --accent: #1f5f4a;      /* deep ledger green, used for focus + active controls */
  --accent-soft: #e2ece7;
  --up: #12784a;
  --down: #b4302a;
  --up-soft: #e3f1e9;
  --down-soft: #f7e4e2;
  --track: #e7ebe7;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #111614; --panel: #171e1b; --ink: #e6ece8; --muted: #93a39a; --rule: #28322d;
    --accent: #6fc3a2; --accent-soft: #1d2d26;
    --up: #4fc88a; --down: #f0776d; --up-soft: #16291f; --down-soft: #321b19; --track: #26302b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #111614; --panel: #171e1b; --ink: #e6ece8; --muted: #93a39a; --rule: #28322d;
  --accent: #6fc3a2; --accent-soft: #1d2d26;
  --up: #4fc88a; --down: #f0776d; --up-soft: #16291f; --down-soft: #321b19; --track: #26302b;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 32px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font: 700 clamp(26px, 4vw, 36px)/1.1 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.quote { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 10px; }
.quote .ltp { font: 500 clamp(28px, 4.5vw, 40px)/1 var(--mono); letter-spacing: -.02em; }
.chg { font: 500 16px var(--mono); padding: 2px 8px; border-radius: 4px; }
.chg.up { color: var(--up); background: var(--up-soft); }
.chg.down { color: var(--down); background: var(--down-soft); }

.facts { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 22px; margin: 0; }
.facts div { display: grid; gap: 1px; }
.facts dt { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font: 500 14px var(--mono); }

/* ---------- breadth ---------- */
.breadth { display: grid; gap: 8px; }
.breadth-line { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.breadth-line b { font-family: var(--mono); font-weight: 500; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--track); gap: 2px; }
.bar span { display: block; height: 100%; }
.bar .a { background: var(--up); } .bar .d { background: var(--down); } .bar .u { background: var(--muted); opacity: .5; }

/* ---------- controls ---------- */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 13px var(--body); color: var(--muted); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.search { display: flex; align-items: center; gap: 10px; flex: 1 1 240px; justify-content: flex-end; }
.search label { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.search input { font: 400 14px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; width: min(260px, 100%); }
.count { font-size: 13px; color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- table ---------- */
.table-wrap { overflow: auto; max-height: 72vh; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--ink); padding: 0; text-align: left; white-space: nowrap; }
thead th.n { text-align: right; }
th button { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 10px 12px; font: 600 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; text-align: inherit; }
th button:hover, th button[data-active] { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
th .arrow { display: inline-block; width: 1ch; margin-left: 3px; color: var(--accent); }
th.plain { padding: 10px 12px; font: 600 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td { padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: middle; }
td.n { text-align: right; }
tbody tr:hover td { background: var(--accent-soft); }
td.sym a { font-weight: 600; letter-spacing: .01em; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
td.sym a:hover { color: var(--accent); border-bottom-color: var(--accent); }
td.sym a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
td.sym .ext { margin-left: 4px; font-size: 11px; color: var(--muted); }
td.sym a:hover .ext { color: var(--accent); }
td.sym .badge { margin-left: 8px; padding: 0 5px; font: 600 10.5px/16px var(--body); letter-spacing: .05em;
  color: var(--down); background: var(--down-soft); border-radius: 3px; cursor: help; vertical-align: 1px; }
td .sub { font-size: 11.5px; margin-left: 4px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.hl { color: var(--muted); }

/* 52-week range: tick shows where today's close sits between the 52W low and high */
.range { display: grid; grid-template-columns: auto 90px auto; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.range .track { position: relative; height: 4px; background: var(--track); border-radius: 2px; }
.range .tick { position: absolute; top: -4px; width: 3px; height: 12px; margin-left: -1.5px; border-radius: 1px; background: var(--ink); }
.empty td { text-align: center; color: var(--muted); padding: 28px; white-space: normal; }


@media (max-width: 720px) {
  .facts { grid-template-columns: repeat(2, auto); }
  .search { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const lines = document.getElementById('raw').textContent.trim().split(/\r?\n/);
  const parseLine = (l) => [...l.matchAll(/"([^"]*)"/g)].map((m) => m[1]);
  const num = (s) => (s === '-' || s === '' ? null : Number(s.replace(/,/g, '')));

  const toRow = (c) => ({
    symbol: c[0], open: num(c[1]), high: num(c[2]), low: num(c[3]), prev: num(c[4]), ltp: num(c[5]),
    change: num(c[7]), pChange: num(c[8]), volume: num(c[9]), value: num(c[10]),
    yHigh: num(c[11]), yLow: num(c[12]), p30: num(c[13]), p365: num(c[14]),
  });

  const all = lines.slice(1).map(parseLine).filter((c) => c.length >= 15).map(toRow);
  const index = all[0];
  const seen = new Set();
  let dupes = 0;
  const stocks = all.slice(1).filter((s) => {
    if (seen.has(s.symbol)) { dupes++; return false; }
    seen.add(s.symbol); return true;
  });

  // symbol,dailyVol,annualVol (fractions, e.g. 0.0357 = 3.57%)
  const vol = new Map(document.getElementById('vol').textContent.trim().split(/\r?\n/).slice(1)
    .map((l) => l.split(',')).filter((c) => c.length === 3)
    .map(([sym, d, a]) => [sym, { d: Number(d), a: Number(a) }]));
  stocks.forEach((s) => { const v = vol.get(s.symbol); s.dVol = v ? v.d : null; s.aVol = v ? v.a : null; });

  // symbol,symbolPe,adjustedPe; NSE leaves a value blank (or omits the stock) when there's no P/E
  const peNum = (v) => (v === undefined || v.trim() === '' ? null : Number(v));
  const pe = new Map(document.getElementById('pe').textContent.trim().split(/\r?\n/).slice(1)
    .map((l) => l.split(',')).map(([sym, p, a]) => [sym, { p: peNum(p), a: peNum(a) }]));
  stocks.forEach((s) => { const v = pe.get(s.symbol); s.pe = v ? v.p : null; s.adjPe = v ? v.a : null; });

  // symbol,series,prevClose,close,vwap,volume,turnoverLacs,trades,deliveryQty,deliveryPct (from the full bhavcopy).
  // The official close is NSE's weighted average of the last 30 minutes, so change is recomputed from it.
  // Volume and value use the bhavcopy's final figures; delivery is blank for trade-to-trade (BE/BZ) series.
  const bnum = (v) => (v === undefined || v === '' ? null : Number(v));
  const bhav = new Map(document.getElementById('bhav').textContent.trim().split(/\r?\n/).slice(1)
    .map((l) => l.split(',')).filter((c) => c.length === 10).map((c) => [c[0], c]));
  const r2 = (n) => Math.round(n * 100) / 100;
  stocks.forEach((s) => {
    const c = bhav.get(s.symbol);
    s.series = c ? c[1] : 'EQ';
    s.close = s.ltp;
    s.vwap = s.trades = s.delivPct = s.avgTrade = s.vsVwap = null;
    if (!c) return;
    const [prev, close, vwap, volume, lacs, trades] = c.slice(2, 8).map(bnum);
    s.close = close;
    s.prev = prev;
    s.change = r2(close - prev);
    s.pChange = r2(((close - prev) / prev) * 100);
    s.volume = volume;
    s.value = lacs / 100; // lakh -> crore
    s.vwap = vwap;
    s.vsVwap = vwap ? ((close - vwap) / vwap) * 100 : null;
    s.trades = trades;
    s.avgTrade = trades ? (lacs * 1e5) / trades : null;
    s.delivPct = bnum(c[9]);
  });

  const f2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
  const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + f2.format(Math.abs(v));
  const dir = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');

  // ---- index header ----
  document.getElementById('idxLtp').textContent = f2.format(index.ltp);
  const chg = document.getElementById('idxChg');
  chg.textContent = `${signed(index.change)}  (${signed(index.pChange)}%)`;
  chg.className = 'chg ' + dir(index.change);
  const facts = [['Open', index.open], ['High', index.high], ['Low', index.low], ['Prev close', index.prev],
                 ['52W high', index.yHigh], ['52W low', index.yLow], ['30D', index.p30, '%'], ['365D', index.p365, '%']];
  document.getElementById('facts').innerHTML = facts.map(([k, v, pct]) =>
    `<div><dt>${k}</dt><dd class="${pct ? dir(v) : ''}">${pct ? signed(v) + '%' : f2.format(v)}</dd></div>`).join('');

  // ---- breadth ----
  const adv = stocks.filter((s) => s.change > 0).length;
  const dec = stocks.filter((s) => s.change < 0).length;
  const unc = stocks.length - adv - dec;
  document.getElementById('breadthLine').innerHTML =
    `<span class="up"><b>${adv}</b> advancing</span><span class="down"><b>${dec}</b> declining</span>` +
    `<span class="flat"><b>${unc}</b> unchanged</span><span class="flat">Turnover <b>₹${f2.format(index.value)} cr</b></span>`;
  document.getElementById('breadthBar').innerHTML =
    `<span class="a" style="flex:${adv}"></span><span class="u" style="flex:${unc}"></span><span class="d" style="flex:${dec}"></span>`;


  // ---- table ----
  const cols = [
    { key: 'symbol', label: 'Symbol' },
    { key: 'close', label: 'Close', n: 1 },
    { key: 'change', label: 'Chg', n: 1 },
    { key: 'pChange', label: '% Chg', n: 1 },
    { label: 'Day low – high', n: 1, plain: 1 },
    { key: 'volume', label: 'Volume', n: 1 },
    { key: 'value', label: 'Value ₹ cr', n: 1 },
    { key: 'delivPct', label: 'Delivery %', n: 1 },
    { key: 'vsVwap', label: 'VWAP', n: 1 },
    { key: 'trades', label: 'Trades', n: 1 },
    { key: 'avgTrade', label: 'Avg trade ₹', n: 1 },
    { key: 'pos52', label: '52W range', plain: 0 },
    { key: 'dVol', label: 'Daily vol', n: 1 },
    { key: 'aVol', label: 'Annual vol', n: 1 },
    { key: 'pe', label: 'Symbol P/E', n: 1 },
    { key: 'adjPe', label: 'Adj. P/E', n: 1 },
    { key: 'p30', label: '30D %', n: 1 },
    { key: 'p365', label: '365D %', n: 1 },
  ];
  stocks.forEach((s) => { s.pos52 = s.yHigh > s.yLow ? (s.close - s.yLow) / (s.yHigh - s.yLow) : 0; });

  const state = { key: 'value', dir: -1, filter: 'all', q: '' };
  const head = document.getElementById('head');

  function renderHead() {
    head.innerHTML = cols.map((c) => {
      if (c.plain) return `<th class="plain ${c.n ? 'n' : ''}" scope="col">${c.label}</th>`;
      const active = state.key === c.key;
      const arrow = active ? (state.dir === 1 ? '▲' : '▼') : '';
      return `<th class="${c.n ? 'n' : ''}" scope="col" aria-sort="${active ? (state.dir === 1 ? 'ascending' : 'descending') : 'none'}">` +
             `<button type="button" data-key="${c.key}" ${active ? 'data-active' : ''}>${c.label}<span class="arrow">${arrow}</span></button></th>`;
    }).join('');
  }

  const pctCell = (v) => `<td class="n ${dir(v)}">${signed(v)}</td>`;
  const volCell = (v) => `<td class="n">${v == null ? '<span class="flat">—</span>' : f2.format(v * 100) + '%'}</td>`;
  const peCell = (v) => `<td class="n">${v == null ? '<span class="flat">—</span>' : f2.format(v)}</td>`;
  const dash = '<span class="flat">—</span>';
  const delivCell = (s) => s.delivPct != null ? `<td class="n">${f2.format(s.delivPct)}%</td>`
    : s.series !== 'EQ' ? `<td class="n"><span class="flat" title="Trade-to-trade series: every trade is delivered">all</span></td>`
    : `<td class="n">${dash}</td>`;
  const vwapCell = (s) => s.vwap == null ? `<td class="n">${dash}</td>`
    : `<td class="n">${f2.format(s.vwap)} <span class="sub ${dir(s.vsVwap)}" title="Close vs VWAP">${signed(s.vsVwap)}%</span></td>`;
  const badge = (s) => s.series === 'EQ' ? ''
    : `<span class="badge" title="Trade-to-trade (${s.series} series): every trade must be settled by delivery, so intraday trading isn't allowed">${s.series}</span>`;
  function rangeCell(s) {
    const pct = Math.max(0, Math.min(1, s.pos52)) * 100;
    return `<td><div class="range" title="${f2.format(s.close)} is ${Math.round(pct)}% of the way from the 52-week low to the high">` +
           `<span class="mono">${f2.format(s.yLow)}</span><span class="track"><span class="tick" style="left:${pct}%"></span></span>` +
           `<span class="mono">${f2.format(s.yHigh)}</span></div></td>`;
  }

  function render() {
    const q = state.q.trim().toUpperCase();
    const rows = stocks
      .filter((s) => state.filter === 'all' || (state.filter === 'up' ? s.change > 0 : s.change < 0))
      .filter((s) => !q || s.symbol.includes(q))
      .sort((a, b) => {
        const x = a[state.key], y = b[state.key];
        if (x == null || y == null) return (x == null) - (y == null); // missing values always last
        return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.dir;
      });

    document.getElementById('count').textContent = `${rows.length} of ${stocks.length} stocks`;
    document.getElementById('rows').innerHTML = rows.length ? rows.map((s) => `<tr>
      <td class="sym"><a href="https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(s.symbol)}" target="_blank" rel="noopener" title="Open ${s.symbol} on NSE">${s.symbol}<span class="ext" aria-hidden="true">↗</span></a>${badge(s)}</td>
      <td class="n">${f2.format(s.close)}</td>
      <td class="n ${dir(s.change)}">${signed(s.change)}</td>
      ${pctCell(s.pChange)}
      <td class="n hl">${f2.format(s.low)} – ${f2.format(s.high)}</td>
      <td class="n">${f0.format(s.volume)}</td>
      <td class="n">${f2.format(s.value)}</td>
      ${delivCell(s)}
      ${vwapCell(s)}
      <td class="n">${s.trades == null ? dash : f0.format(s.trades)}</td>
      <td class="n">${s.avgTrade == null ? dash : f0.format(s.avgTrade)}</td>
      ${rangeCell(s)}
      ${volCell(s.dVol)}
      ${volCell(s.aVol)}
      ${peCell(s.pe)}
      ${peCell(s.adjPe)}
      ${pctCell(s.p30)}
      ${pctCell(s.p365)}
    </tr>`).join('') : `<tr class="empty"><td colspan="${cols.length}">No stocks match “${state.q}”. Try part of the NSE symbol.</td></tr>`;
  }

  head.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    const k = b.dataset.key;
    if (state.key === k) state.dir = -state.dir;
    else { state.key = k; state.dir = k === 'symbol' ? 1 : -1; }
    renderHead(); render();
  });
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    state.filter = b.dataset.filter;
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });

  renderHead(); render();
})();
</script>
